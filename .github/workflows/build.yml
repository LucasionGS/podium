name: Build

# Every push to master and every PR builds the installers as run artifacts. When master's package.json has a
# version that isn't released yet, the push also publishes it: a GitHub Release and the AUR packages.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# A newer push to a PR replaces its build still running. Master runs always finish: any of them may be a release.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    # The tests take about a minute; a hang (e.g. an FFmpeg pipe deadlock) shouldn't run for the default 6 hours.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg xvfb
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # Electron needs a display server even for hidden windows.
      - run: xvfb-run -a pnpm test:e2e

  # Releases are named after package.json's version: a version without a GitHub Release yet gets one.
  version:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.read.outputs.tag }}
      prerelease: ${{ steps.read.outputs.prerelease }}
      release: ${{ steps.read.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          case "$version" in *-*) echo "prerelease=true" ;; *) echo "prerelease=false" ;; esac >> "$GITHUB_OUTPUT"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "v$version is already released; bump \"version\" in package.json to publish a new one."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Releasing v$version."
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  package:
    needs: [test, version]
    # `version` is skipped for PRs and other branches; they still get packaged.
    if: always() && needs.test.result == 'success' && needs.version.result != 'failure'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            # bsdtar (libarchive-tools) is what electron-builder uses to write pacman packages.
            setup: sudo apt-get update && sudo apt-get install -y libarchive-tools
            targets: --linux AppImage pacman
          - os: windows-latest
            name: windows
            targets: --win nsis
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - if: matrix.setup
        run: ${{ matrix.setup }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec electron-builder ${{ matrix.targets }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: podium-${{ matrix.name }}
          path: |
            dist/*.AppImage
            dist/*.pacman
            dist/*.exe
          if-no-files-found: error

  release:
    if: needs.version.outputs.release == 'true'
    needs: [version, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - run: |
          cd artifacts
          sha256sum -- * > SHA256SUMS.txt
          ls -la
      # Tag the released commit so the release points at exactly what was built. A re-run after a failed
      # release finds the tag already there.
      - run: |
          tag="${{ needs.version.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag is already tagged"
          else
            git tag "$tag"
            git push origin "$tag"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Podium ${{ needs.version.outputs.tag }}
          prerelease: ${{ needs.version.outputs.prerelease }}
          generate_release_notes: true
          files: artifacts/*
          fail_on_unmatched_files: true

  # Publishes the release to the AUR: podium builds the tagged source, podium-bin installs the release's
  # pacman package. Prereleases stay off the AUR. Needs the AUR_SSH_PRIVATE_KEY secret.
  aur:
    if: needs.version.outputs.release == 'true' && needs.version.outputs.prerelease == 'false'
    needs: [version, release]
    runs-on: ubuntu-latest
    # makepkg (for .SRCINFO and checksums) only exists on Arch, and refuses to run as root.
    container: archlinux:base-devel
    timeout-minutes: 15
    steps:
      # Before checkout: without git, actions/checkout downloads a tarball instead of a repository.
      - run: pacman -Syu --noconfirm --needed git openssh pacman-contrib
      - uses: actions/checkout@v4
      - name: Publish podium and podium-bin
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          VERSION: ${{ needs.version.outputs.tag }}
        run: |
          if [ -z "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "::error::Set the AUR_SSH_PRIVATE_KEY secret to publish releases to the AUR."
            exit 1
          fi
          useradd -m builder
          chown -R builder .
          install -d -m 700 /home/builder/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > /home/builder/.ssh/aur
          chmod 600 /home/builder/.ssh/aur
          ssh-keyscan -t ed25519 aur.archlinux.org > /home/builder/.ssh/known_hosts
          chown -R builder /home/builder/.ssh
          as_builder() { runuser -u builder -- env HOME=/home/builder AUR_SSH_KEY=/home/builder/.ssh/aur "$@"; }
          as_builder git config --global user.name "Lucasion"
          as_builder git config --global user.email "ion@ionnet.dev"
          for pkg in podium podium-bin; do
            as_builder packaging/aur/publish.sh -y -v "$VERSION" "$pkg"
          done
