appId: dev.ionnet.podium
productName: Podium
copyright: Copyright © 2026 Lucas Ion
directories:
  output: dist
  buildResources: resources
files:
  - out/**
  - package.json
extraResources:
  - from: resources/tray.png
    to: tray.png
  - from: resources/icon.png
    to: icon.png
# The only native module (uiohook-napi) ships prebuilt N-API binaries that work in any Electron, so don't
# compile it again (that would need a C toolchain and X11 headers on every build machine).
npmRebuild: false
# Executables cannot run from inside the asar archive.
asarUnpack:
  - node_modules/ffmpeg-static/**
  - node_modules/ffprobe-static/**
linux:
  icon: resources/icon.png
  category: AudioVideo
  executableName: podium
  # System packages (pacman, deb) need a "homepage" in package.json; see `pnpm dist:pacman`.
  # Each kind updates itself differently (src/main/update); they find out which they are from `package-type`.
  target: [AppImage]
  # ffprobe-static ships every platform's binary, and a cross-build leaves ffmpeg.exe next to ffmpeg.
  files:
    - '!node_modules/ffmpeg-static/ffmpeg.exe*'
    - '!node_modules/ffprobe-static/bin/darwin/**'
    - '!node_modules/ffprobe-static/bin/win32/**'
pacman:
  # These are what Electron actually loads. gpu-screen-recorder does the capturing on Linux.
  depends: [gtk3, nss, libxss, libnotify, alsa-lib, at-spi2-core, libxkbcommon, mesa, libcups]
  # electron-builder has no optdepends field; README tells users to install gpu-screen-recorder.
deb:
  # Debian and Ubuntu don't package gpu-screen-recorder; README points to its Flatpak.
  packageCategory: video
win:
  icon: resources/icon.png
  # Squirrel installs per user (no admin) and updates itself from the GitHub releases (see src/main/update).
  target: [squirrel]
  files:
    - '!node_modules/ffmpeg-static/ffmpeg'
    - '!node_modules/ffprobe-static/bin/darwin/**'
    - '!node_modules/ffprobe-static/bin/linux/**'
squirrelWindows:
  # Shown in Programs and Features; Squirrel only takes a URL here.
  iconUrl: https://raw.githubusercontent.com/LucasionGS/podium/master/resources/icon.ico
mac:
  icon: resources/icon.png
  category: public.app-category.video
  target: [dmg]
  files:
    - '!node_modules/ffmpeg-static/ffmpeg.exe*'
    - '!node_modules/ffprobe-static/bin/linux/**'
    - '!node_modules/ffprobe-static/bin/win32/**'
